<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 760" width="1140" height="760" role="img" aria-label="Noetix learning path — four stages from setup to production">
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93A0BE"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif; fill:#E6EAF4; }
    .st  { font-family: ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif; fill:#E6EAF4; font-weight:700; font-size:18px; }
    .n   { font-family: ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif; fill:#E6EAF4; font-size:13px; }
    .cap { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:#93A0BE; font-size:11.5px; }
    .box { fill:#131A2E; stroke:#24304D; stroke-width:1.4; }
  </style>

  <rect width="1140" height="760" rx="18" fill="#0B1020"/>
  <text x="40" y="52" class="t" font-size="26" font-weight="700">The path through Noetix</text>
  <text x="40" y="78" class="cap">four stages · twenty sections · read top-to-bottom the first time, jump around forever after</text>
  <line x1="40" y1="96" x2="1100" y2="96" stroke="#24304D"/>

  <!-- Stage 1 -->
  <rect x="40" y="122" width="1060" height="140" rx="14" fill="#0E1526" stroke="#6EE7F9" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="76" cy="156" r="16" fill="#101E3A" stroke="#6EE7F9"/>
  <text x="76" y="162" class="cap" fill="#6EE7F9" text-anchor="middle" font-size="14">1</text>
  <text x="106" y="162" class="st">Foundations</text>
  <text x="270" y="162" class="cap">get a reproducible environment and a red test before you write a line of Django</text>

  <rect x="66" y="182" width="192" height="62" rx="10" class="box"/>
  <text x="162" y="208" class="n" text-anchor="middle">App Design</text>
  <text x="162" y="228" class="cap" text-anchor="middle">01 · what we're building</text>

  <rect x="270" y="182" width="192" height="62" rx="10" class="box"/>
  <text x="366" y="208" class="n" text-anchor="middle">System Setup</text>
  <text x="366" y="228" class="cap" text-anchor="middle">02 · tools + verify</text>

  <rect x="474" y="182" width="192" height="62" rx="10" class="box"/>
  <text x="570" y="208" class="n" text-anchor="middle">Project Setup</text>
  <text x="570" y="228" class="cap" text-anchor="middle">03 · Docker + flake8</text>

  <rect x="678" y="182" width="192" height="62" rx="10" class="box"/>
  <text x="774" y="208" class="n" text-anchor="middle">GitHub Actions</text>
  <text x="774" y="228" class="cap" text-anchor="middle">04 · CI on every push</text>

  <rect x="882" y="182" width="192" height="62" rx="10" class="box" stroke="#FBBF24" stroke-opacity="0.5"/>
  <text x="978" y="208" class="n" text-anchor="middle">TDD</text>
  <text x="978" y="228" class="cap" text-anchor="middle" fill="#FBBF24">red → green → refactor</text>

  <path d="M570,266 L570,286" stroke="#93A0BE" stroke-width="1.6" marker-end="url(#n)"/>

  <!-- Stage 2 -->
  <rect x="40" y="292" width="1060" height="140" rx="14" fill="#0E1526" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="76" cy="326" r="16" fill="#1A1633" stroke="#A78BFA"/>
  <text x="76" y="332" class="cap" fill="#A78BFA" text-anchor="middle" font-size="14">2</text>
  <text x="106" y="332" class="st">The spine</text>
  <text x="270" y="332" class="cap">database, identity, admin — the parts every Django project on earth has</text>

  <rect x="66" y="352" width="245" height="62" rx="10" class="box"/>
  <text x="188" y="378" class="n" text-anchor="middle">Configure Database</text>
  <text x="188" y="398" class="cap" text-anchor="middle">05 · Postgres + wait_for_db</text>

  <rect x="323" y="352" width="245" height="62" rx="10" class="box"/>
  <text x="445" y="378" class="n" text-anchor="middle">Custom User Model</text>
  <text x="445" y="398" class="cap" text-anchor="middle">06 · do it on day one</text>

  <rect x="580" y="352" width="245" height="62" rx="10" class="box"/>
  <text x="702" y="378" class="n" text-anchor="middle">Django Admin</text>
  <text x="702" y="398" class="cap" text-anchor="middle">07 · free CRUD UI</text>

  <rect x="837" y="352" width="237" height="62" rx="10" class="box"/>
  <text x="955" y="378" class="n" text-anchor="middle">API Documentation</text>
  <text x="955" y="398" class="cap" text-anchor="middle">08 · drf-spectacular</text>

  <path d="M570,436 L570,456" stroke="#93A0BE" stroke-width="1.6" marker-end="url(#n)"/>

  <!-- Stage 3 -->
  <rect x="40" y="462" width="1060" height="140" rx="14" fill="#0E1526" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="76" cy="496" r="16" fill="#0F2A24" stroke="#34D399"/>
  <text x="76" y="502" class="cap" fill="#34D399" text-anchor="middle" font-size="14">3</text>
  <text x="106" y="502" class="st">Building the API</text>
  <text x="270" y="502" class="cap">the same loop five times — write the test, write the view, watch it go green</text>

  <rect x="66" y="522" width="160" height="62" rx="10" class="box"/>
  <text x="146" y="548" class="n" text-anchor="middle">User API</text>
  <text x="146" y="568" class="cap" text-anchor="middle">09 · auth</text>

  <rect x="238" y="522" width="160" height="62" rx="10" class="box"/>
  <text x="318" y="548" class="n" text-anchor="middle">Recipe API</text>
  <text x="318" y="568" class="cap" text-anchor="middle">10 · ViewSets</text>

  <rect x="410" y="522" width="160" height="62" rx="10" class="box"/>
  <text x="490" y="548" class="n" text-anchor="middle">Tag API</text>
  <text x="490" y="568" class="cap" text-anchor="middle">11 · nested writes</text>

  <rect x="582" y="522" width="160" height="62" rx="10" class="box"/>
  <text x="662" y="548" class="n" text-anchor="middle">Ingredient API</text>
  <text x="662" y="568" class="cap" text-anchor="middle">12 · refactor</text>

  <rect x="754" y="522" width="160" height="62" rx="10" class="box"/>
  <text x="834" y="548" class="n" text-anchor="middle">Image API</text>
  <text x="834" y="568" class="cap" text-anchor="middle">13 · uploads</text>

  <rect x="926" y="522" width="148" height="62" rx="10" class="box"/>
  <text x="1000" y="548" class="n" text-anchor="middle">Filtering</text>
  <text x="1000" y="568" class="cap" text-anchor="middle">14 · query params</text>

  <path d="M570,606 L570,626" stroke="#93A0BE" stroke-width="1.6" marker-end="url(#n)"/>

  <!-- Stage 4 -->
  <rect x="40" y="632" width="1060" height="102" rx="14" fill="#0E1526" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1.5"/>
  <circle cx="76" cy="666" r="16" fill="#2B1F10" stroke="#FBBF24"/>
  <text x="76" y="672" class="cap" fill="#FBBF24" text-anchor="middle" font-size="14">4</text>
  <text x="106" y="672" class="st">Production</text>
  <text x="270" y="672" class="cap">where a course ends and a real service begins</text>

  <rect x="66" y="688" width="192" height="34" rx="9" class="box"/>
  <text x="162" y="710" class="cap" text-anchor="middle" fill="#E6EAF4">15 · Deployment</text>
  <rect x="270" y="688" width="192" height="34" rx="9" class="box"/>
  <text x="366" y="710" class="cap" text-anchor="middle" fill="#E6EAF4">16 · All Fixes</text>
  <rect x="474" y="688" width="192" height="34" rx="9" class="box"/>
  <text x="570" y="710" class="cap" text-anchor="middle" fill="#E6EAF4">17 · Production DRF</text>
  <rect x="678" y="688" width="192" height="34" rx="9" class="box"/>
  <text x="774" y="710" class="cap" text-anchor="middle" fill="#E6EAF4">18 · Reference</text>
  <rect x="882" y="688" width="192" height="34" rx="9" class="box"/>
  <text x="978" y="710" class="cap" text-anchor="middle" fill="#E6EAF4">19 · Interview</text>
</svg>

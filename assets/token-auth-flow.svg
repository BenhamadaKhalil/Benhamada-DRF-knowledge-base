<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-label="Token authentication sequence between client, DRF and the database">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6EE7F9"/>
    </marker>
    <marker id="sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34D399"/>
    </marker>
    <marker id="sr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/>
    </marker>
  </defs>
  <style>
    .t   { font-family: ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif; fill:#E6EAF4; }
    .hdr { font-family: ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif; fill:#E6EAF4; font-weight:600; font-size:15px; }
    .msg { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:#C7D0E4; font-size:12px; }
    .cap { font-family: ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill:#93A0BE; font-size:11.5px; }
    .box { fill:#131A2E; stroke:#24304D; stroke-width:1.5; }
  </style>

  <rect width="1080" height="640" rx="18" fill="#0B1020"/>
  <text x="40" y="52" class="t" font-size="26" font-weight="700">Token auth, end to end</text>
  <text x="40" y="78" class="cap">credentials once → token many times</text>
  <line x1="40" y1="96" x2="1040" y2="96" stroke="#24304D"/>

  <!-- lifelines -->
  <rect x="60" y="120" width="190" height="48" rx="10" class="box" stroke="#6EE7F9" stroke-opacity="0.5"/>
  <text x="155" y="150" class="hdr" text-anchor="middle">Client</text>
  <line x1="155" y1="176" x2="155" y2="560" stroke="#24304D" stroke-dasharray="5 6"/>

  <rect x="420" y="120" width="240" height="48" rx="10" class="box" stroke="#A78BFA" stroke-opacity="0.5"/>
  <text x="540" y="150" class="hdr" text-anchor="middle">DRF</text>
  <line x1="540" y1="176" x2="540" y2="560" stroke="#24304D" stroke-dasharray="5 6"/>

  <rect x="830" y="120" width="190" height="48" rx="10" class="box" stroke="#34D399" stroke-opacity="0.5"/>
  <text x="925" y="150" class="hdr" text-anchor="middle">PostgreSQL</text>
  <line x1="925" y1="176" x2="925" y2="560" stroke="#24304D" stroke-dasharray="5 6"/>

  <!-- phase 1 label -->
  <rect x="60" y="192" width="140" height="24" rx="6" fill="#101E3A" stroke="#6EE7F9" stroke-opacity="0.4"/>
  <text x="130" y="209" class="cap" fill="#6EE7F9" text-anchor="middle">1 · get a token</text>

  <path d="M157,242 L534,242" stroke="#6EE7F9" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="345" y="234" class="msg" text-anchor="middle">POST /api/user/token/  {"email","password"}</text>

  <path d="M542,276 L919,276" stroke="#6EE7F9" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="730" y="268" class="msg" text-anchor="middle">authenticate() → check_password()</text>

  <path d="M919,308 L546,308" stroke="#34D399" stroke-width="1.8" marker-end="url(#sg)"/>
  <text x="730" y="300" class="msg" text-anchor="middle">Token.objects.get_or_create(user)</text>

  <path d="M534,340 L161,340" stroke="#34D399" stroke-width="1.8" marker-end="url(#sg)"/>
  <text x="345" y="332" class="msg" text-anchor="middle">200  {"token": "9c1f…"}</text>

  <rect x="60" y="354" width="190" height="42" rx="8" fill="#0F2A24" stroke="#34D399" stroke-opacity="0.35"/>
  <text x="155" y="371" class="cap" fill="#34D399" text-anchor="middle">store it securely</text>
  <text x="155" y="388" class="cap" text-anchor="middle">Keychain · httpOnly cookie</text>

  <!-- phase 2 -->
  <rect x="60" y="418" width="200" height="24" rx="6" fill="#1A1633" stroke="#A78BFA" stroke-opacity="0.4"/>
  <text x="160" y="435" class="cap" fill="#A78BFA" text-anchor="middle">2 · use it, every time</text>

  <path d="M157,470 L534,470" stroke="#6EE7F9" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="345" y="462" class="msg" text-anchor="middle">GET /api/recipe/recipes/</text>
  <text x="345" y="488" class="msg" text-anchor="middle" fill="#FBBF24">Authorization: Token 9c1f…</text>

  <path d="M542,516 L919,516" stroke="#6EE7F9" stroke-width="1.8" marker-end="url(#s)"/>
  <text x="730" y="508" class="msg" text-anchor="middle">SELECT … FROM authtoken_token  ← one lookup per request</text>

  <path d="M534,552 L161,552" stroke="#34D399" stroke-width="1.8" marker-end="url(#sg)"/>
  <text x="345" y="544" class="msg" text-anchor="middle">200  [ …only this user's recipes… ]</text>

  <!-- side notes -->
  <rect x="700" y="352" width="340" height="112" rx="12" fill="#1B1020" stroke="#FB7185" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="724" y="378" class="hdr" fill="#FB7185">What can go wrong</text>
  <text x="724" y="402" class="cap">missing header      → 401 NotAuthenticated</text>
  <text x="724" y="424" class="cap">"Bearer" not "Token" → 401 (classic)</text>
  <text x="724" y="446" class="cap">valid token, wrong owner → empty list, not 403</text>

  <text x="40" y="606" class="cap">There is no logout endpoint — logging out means deleting the token on the client. Server-side "logout" is unreliable. — Noetix by KB</text>
</svg>
